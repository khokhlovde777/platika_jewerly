<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css">
    <title>демо версия вёрстки</title>
    <style>

      * {
        box-sizing: border-box;
      }

      body {
        background: radial-gradient(900px 480px at 20% 0%, rgba(155, 27, 27, 0.06), transparent 65%),
          radial-gradient(760px 520px at 100% 20%, rgba(23, 48, 79, 0.06), transparent 60%),
          white;
        color: black;
        background-repeat: no-repeat;
      }

      a {
        color: inherit;
      }

      .container {
        max-width: 920px;
        margin: 0 auto;
        padding: 48px 20px 56px;
      }

      header {
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: -0.02em;
        color: black;
      }

      .subtitle {
        margin: 0;
        color: black;
      }

      .grid {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 14px 12px;
        background: #191919;
        border: 1px solid #191919;
        text-decoration: none;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease,
          box-shadow 120ms ease;
      }

      .card_two {
        background-color: #373737;
      }

      .card:hover {
        transform: translateY(-1px);
        background-color: white;
        box-shadow: 0 6px 20px rgba(57, 1, 1, 0.08);
        color: black
      }

      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .page-title {
        font-weight: 650;
        color: white;
      }

      .badge {
        flex: none;
        font-size: 12px;
        color: white;
        border: 1px solid white;
        border-radius: 999px;
        padding: 2px 10px;
      }

      .path {
        margin: 0;
        font-size: 13px;
        color: white;
        word-break: break-all;
      }

      .card:hover .title-row .page-title {
        color: #191919;
      }

      .card:hover .title-row .badge {
        color: #191919;
        border: 1px solid #191919;
      }

      .card:hover .path {
        color: #191919;
      }

      .card_two:hover .title-row .page-title {
        color: #373737;
      }

      .card_two:hover .title-row .badge {
        color: #373737;
        border: 1px solid #373737;
      }

      .card_two:hover .path {
        color: #373737;
      }

      @media (max-width: 666px) {
        .grid {
          display: flex;
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header>
        <h1>Демо версия вёрстки</h1>
        <p class="subtitle">Быстрые ссылки для открытия страниц.</p>
      </header>

      <main class="grid">
        
        <a class="card" href="html/main.html">
          <div class="title-row">
            <div class="page-title">Главная</div>
            <div class="badge">main</div>
          </div>
          <p class="path">html/main.html</p>
        </a>

        <a class="card card_two" href="html/collections.html">
          <div class="title-row">
            <div class="page-title">Коллеекция</div>
            <div class="badge">collections</div>
          </div>
          <p class="path">html/collections.html</p>
        </a>

      </main>
    </div>
  </body>
</html>
