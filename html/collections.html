<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/collections.css">
  <title>Коллекция</title>
</head>
<body>
  
  <header>
    <div class="header-wrapper header-desktop">
      <div class="header-content">
        <div class="header__logo-wrapper">
          <img class="header__logo-img" src="../src/logo.png" alt="">
        </div>
        <div class="header__links-wrapper">
          <a href="" class="header__link">Контакты</a>
          <a href="" class="header__link">Коллеекция</a>
          <a href="" class="header__link">О компании</a>
          <a href="" class="header__link">Блог</a>
          <button type="button" class="btn header__button">Оставить заявку</button>
        </div>
      </div>
    </div>
  </header>

  
  <main>

    <section class="collect-head-section">
      <div class="content-area">
          <h1 class="collect-head-label">Коллекции</h1>
      </div>
    </section>

    <section class="collect-content-section">
      <div class="content-area">
        <div class="collect-content">

          <div class="collect-items-wrapper">
            <div class="collect-item"></div>
          </div>

        </div>
      </div>
    </section>

  </main>


  <footer class="footer-wrapper">
    <div class="footer-content">
      <div class="footer-logo-contacts-links">
        <div class="footer-logo-contacts-wrapper">
          <img class="footer__logo" src="../src/logo.png" alt="">
          <div class="footer-contacts__wrapper">
            <div class="footer-contact-wrapper">
              <img class="footer-contact__img" src="../src/icons/tel.svg" alt="">
              <a href="" class="footer-contact__text">8-800-1012-950</a>
            </div>
            <div class="footer-contact-wrapper">
              <img class="footer-contact__img" src="../src/icons/mail.svg" alt="">
              <a href="" class="footer-contact__text">platika.sales@yandex.ru</a>
            </div>
            <div class="footer-contact-wrapper">
              <img class="footer-contact__img" src="../src/icons/map.svg" alt="">
              <p class="footer-contact__text">156019, г. Кострома,<br>ул. П. Щербины,<br>дом 2, помещение 10,11<p>
            </div>
          </div>
        </div>
        <div class="footer-links-wrapper">
          <a href="" class="footer-link">Контакты</a>
          <a href="" class="footer-link">Коллекции</a>
          <a href="" class="footer-link">Каталог</a>
          <a href="" class="footer-link">О компании</a>
          <a href="" class="footer-link">Premium</a>
          <a href="" class="footer-link">Блог</a>
        </div>
      </div>
      <div class="footer-copyright-maps">
        <p class="footer_copyright">© 2026 Platika. Ювелирные изделия из драгоценных<br>металов со вставками. Все права защищены.</p>
        <button type="button" class="btn footer-btn-maps">
          <img class="footer-btn-maps__icon" src="../src/icons/ya-maps.svg" alt="">
          <p class="footer-btn-maps__label">Яндекс карты</p>
        </button>
      </div>
    </div>
  </footer>

</body>
</html>
