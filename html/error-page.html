<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/header.css">
  <link rel="stylesheet" href="../css/error-page.css">
  <title>404 Ошибка</title>
</head>
<body>


  <header>
    <div class="header-wrapper header-desktop">
      <div class="header-content">
        <a class="header__logo-wrapper">
          <img class="header__logo-img" src="../src/logo.svg" alt="">
        </a>
        <div class="header__links-wrapper">
          <a href="" class="header__link">Контакты</a>
          <a href="" class="header__link">Коллеекция</a>
          <a href="" class="header__link">О компании</a>
          <a href="" class="header__link">Блог</a>
          <button type="button" class="btn header__button">Оставить заявку</button>
        </div>
      </div>
    </div>

    <div class="header-wrapper header-mob">
      <div class="header-content">
        <button id="header-mob-btn" type="button" class="btn header-mob-btn menu-open"><img src="../src/icons/menu__burger.svg" alt=""></button>
        <a class="header__logo-wrapper--mob">
          <img class="header__logo-img--mob" src="../src/logo.svg" alt="">
        </a>
      </div>
      <div class="header-menu-mob">
        <div class="header-menu-mob-up">
          <img class="header-menu-mob__close" src="../src/icons/burger_close.svg" alt="">
          <img class="header-menu-mob__logo" src="../src/logo.svg" alt="">
        </div>
        <div class="header-menu-mob-links-wrapper">
          <a href="" class="header-menu-mob-link">Контакты</a>
          <a href="" class="header-menu-mob-link">Колекции</a>
          <a href="" class="header-menu-mob-link">О компании</a>
          <a href="" class="header-menu-mob-link">Блог</a>
        </div>
        <button type="button" class="btn header-menu-mob-btn">Оставить заявку</button>
      </div>
    </div>
  </header>

  <main>
    <div class="error-page-content">
      <p class="ep-code">404</p>
      <p class="ep-label">Упс! Кажется такой страницы не существует</p>
      <button class="btn ep-btn" type="button">На главную</button>
    </div>
  </main>

  
</body>
</html>
